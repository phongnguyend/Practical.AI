# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: practical-microsoft-agent-framework

requiredVersions:
  azd: ">=1.27.1"
  extensions:
    azure.ai.agents: ">=1.0.0-beta.8"
    azure.ai.projects: ">=1.0.0-beta.4"

services:
  ai-project:
    host: azure.ai.project
    endpoint: https://foundry-sd1597.services.ai.azure.com/api/projects/project-sd1597

  practical-microsoft-agent-framework:
    host: azure.ai.agent
    project: Practical.MicrosoftAgentFramework.FoundryHostedAgent
    language: docker
    uses:
      - ai-project
    env:
      ASPNETCORE_URLS: http://+:8088
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
    container:
      resources:
        cpu: "0.5"
        memory: 1Gi
    description: A practical Microsoft Agent Framework assistant with memory, skills, and optional enterprise tools.
    kind: hosted
    name: practical-microsoft-agent-framework
    protocols:
      - protocol: responses
        version: 2.0.0
